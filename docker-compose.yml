services:
  openalgo-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openalgo-mcp-rust
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OPENALGO_URL=${OPENALGO_URL:-http://host.docker.internal:5000}
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-changeme}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
